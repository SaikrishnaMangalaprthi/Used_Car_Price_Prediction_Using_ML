{% extends 'base.html' %}
{% block title %}Login — Auto Worth AI{% endblock %}
{% block content %}

<div style="
  min-height: calc(100vh - 64px);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
">
  <div style="
    background: var(--card);
    border: 1px solid var(--card-b);
    border-radius: 14px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
  ">

    <div style="text-align: center; margin-bottom: 26px;">
      <div style="
        width: 58px; height: 58px; border-radius: 50%;
        background: #EFF6FF;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 16px;
      ">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
             stroke="#2563EB" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </div>
      <h2 style="font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 5px;">Welcome Back!</h2>
      <p style="font-size: 13px; color: var(--muted);">Login to your account</p>
    </div>

    {% if error %}
    <div style="
      background: #FEF2F2;
      border-left: 4px solid #991B1B;
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 18px;
      font-size: 12px;
      color: #991B1B;
      line-height: 1.5;
    ">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{% url 'UserLoginCheck' %}">
      {% csrf_token %}

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 5px;">Email</label>
        <input type="email" name="email" placeholder="Enter your email" required
          style="
            width: 100%; padding: 10px 13px;
            border: 1px solid var(--input-b);
            border-radius: 6px; font-size: 13px;
            background: var(--input-bg); color: var(--text);
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
          "
          onfocus="this.style.borderColor='#2563EB';this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.12)'"
          onblur="this.style.borderColor='';this.style.boxShadow=''">
      </div>

      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 5px;">Password</label>
        <div style="position: relative;">
          <input type="password" name="password" id="login-password" placeholder="Enter your password" required
            style="
              width: 100%; padding: 10px 44px 10px 13px;
              border: 1px solid var(--input-b);
              border-radius: 6px; font-size: 13px;
              background: var(--input-bg); color: var(--text);
              outline: none; transition: border-color 0.2s, box-shadow 0.2s;
            "
            onfocus="this.style.borderColor='#2563EB';this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.12)'"
            onblur="this.style.borderColor='';this.style.boxShadow=''">
          <button type="button" id="eye-btn" onclick="togglePassword()"
            style="
              position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
              background: none; border: none; cursor: pointer;
              color: #9CA3AF; font-size: 17px; padding: 0; line-height: 1;
            ">&#128065;</button>
        </div>
      </div>

      <button type="submit" style="
        width: 100%; background: #2563EB; color: white;
        border: none; padding: 14px; border-radius: 8px;
        font-size: 16px; font-weight: 600; cursor: pointer;
      ">Login</button>

      <div style="text-align: center; margin-top: 22px;">
        <p style="font-size: 13px; color: var(--muted); margin-bottom: 8px;">Don't have an account?</p>
        <a href="{% url 'UserRegister' %}" style="
          color: #2563EB; text-decoration: none;
          font-size: 13px; font-weight: 600;
        ">Register here</a>
      </div>

    </form>
  </div>
</div>

<script>
function togglePassword() {
  var inp = document.getElementById('login-password');
  var btn = document.getElementById('eye-btn');
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.innerHTML = '&#128064;';
  } else {
    inp.type = 'password';
    btn.innerHTML = '&#128065;';
  }
}
</script>

{% endblock %}
