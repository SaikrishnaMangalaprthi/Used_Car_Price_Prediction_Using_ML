{% extends 'base.html' %}
{% block title %}Admin Login — AutoValue AI{% endblock %}

{% block content %}
<div class="container" style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:60px 16px;">
  <div style="width:100%;max-width:400px;">

    <div class="text-center mb-5">
      <div style="width:64px;height:64px;background:linear-gradient(135deg,#f59e0b,#d97706);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;">🔐</div>
      <h2 style="font-weight:800;font-size:1.8rem;margin-bottom:6px;">Admin Access</h2>
      <p style="color:var(--text-secondary);font-size:0.9rem;">Restricted — Authorized Personnel Only</p>
    </div>

    <div class="card" style="border-color:rgba(245,158,11,0.2);">
      <div class="card-body p-4">
        {% if error %}
        <div class="alert alert-danger d-flex gap-2 align-items-center mb-4">
          <i class="bi bi-exclamation-circle"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'AdminLoginCheck' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Admin Username</label>
            <div class="input-icon-wrap">
              <span class="icon"><i class="bi bi-person-fill-lock"></i></span>
              <input type="text" name="username" class="form-control" placeholder="Admin username" required autofocus/>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <div class="input-icon-wrap" style="position:relative;">
              <span class="icon"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="password" id="apwd" class="form-control" placeholder="Admin password" required/>
              <button type="button" onclick="togglePwd()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;">
                <i class="bi bi-eye" id="aeye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn w-100 py-3" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:700;border-radius:10px;font-size:1rem;">
            <i class="bi bi-box-arrow-in-right me-2"></i>Access Dashboard
          </button>
        </form>
      </div>
    </div>

    <p class="text-center mt-4">
      <a href="{% url 'UserHome' %}" style="color:var(--text-muted);font-size:0.85rem;text-decoration:none;">
        <i class="bi bi-arrow-left me-1"></i>Back to Home
      </a>
    </p>
  </div>
</div>

<script>
function togglePwd() {
  const f = document.getElementById('apwd'), e = document.getElementById('aeye');
  f.type = f.type === 'password' ? 'text' : 'password';
  e.className = f.type === 'text' ? 'bi bi-eye-slash' : 'bi bi-eye';
}
</script>
{% endblock %}
