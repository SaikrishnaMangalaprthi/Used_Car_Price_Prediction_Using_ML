{% extends 'base.html' %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<div class="container">
  <h2>🔴 Admin Dashboard</h2>
  <div class="stat-cards">
    <div class="stat-card" style="background:#1565C0;">
      <div class="num">{{ total_users }}</div><div class="lbl">Total Users</div></div>
    <div class="stat-card" style="background:#2E7D32;">
      <div class="num">{{ active_users }}</div><div class="lbl">Active Users</div></div>
    <div class="stat-card" style="background:#E65100;">
      <div class="num">{{ total_predictions }}</div><div class="lbl">Total Predictions</div></div>
    <div class="stat-card" style="background:#6A1B9A;">
      <div class="num">&#8377;{{ avg_price }}</div><div class="lbl">Avg Predicted Price</div></div>
  </div>
  <a href="{% url 'RegisterUsersView' %}" class='btn btn-primary'>Manage Users</a>
</div>
{% endblock %}
